<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Car Upgrade Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e1e24;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #2b2d42;
      border-radius: 10px;
      padding: 20px;
      max-width: 400px;
      margin: 0 auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .stats {
      font-size: 1.2rem;
      margin-bottom: 15px;
    }
    button {
      background: #4caf50;
      color: white;
      border: none;
      padding: 10px 15px;
      margin: 5px;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🚗 Car Garage</h2>
    
    <!-- Stats Display -->
    <div class="stats">
      <p>💰 Coins: <span id="coin-count">0</span></p>
      <p>⚡ Top Speed: <span id="car-speed">100</span> km/h</p>
    </div>

    <!-- Controls -->
    <button onclick="collectCoins()">🪙 Collect 10 Coins</button>
    <button id="upgrade-btn" onclick="upgradeCar()">🚀 Upgrade Speed (Cost: 50)</button>
  </div>

  <!-- Audio Elements -->
  <!-- Note: Replace the sound URLs with your own .mp3 file paths -->
  <audio id="sfx-coin" src="https://actions.google.com/sounds/v1/cartoon/clink_1.ogg" preload="auto"></audio>
  <audio id="sfx-upgrade" src="https://actions.google.com/sounds/v1/cartoon/wood_whistle.ogg" preload="auto"></audio>

  <script>
    // Game State
    let coins = 0;
    let topSpeed = 100;
    let upgradeCost = 50;

    // Helper function to play sound with rapid-click support
    function playSFX(id) {
      const sound = document.getElementById(id);
      sound.currentTime = 0;
      sound.play();
    }

    // Function to handle earning coins
    function collectCoins() {
      coins += 10;
      playSFX('sfx-coin');
      updateUI();
    }

    // Function to handle upgrading the car
    function upgradeCar() {
      if (coins >= upgradeCost) {
        coins -= upgradeCost;
        topSpeed += 15;
        upgradeCost += 25; // Increase cost for next upgrade
        
        playSFX('sfx-upgrade');
        updateUI();
      }
    }

    // Function to refresh UI display
    function updateUI() {
      document.getElementById('coin-count').innerText = coins;
      document.getElementById('car-speed').innerText = topSpeed;
      
      const upgradeBtn = document.getElementById('upgrade-btn');
      upgradeBtn.innerText = `🚀 Upgrade Speed (Cost: ${upgradeCost})`;
      
      // Disable upgrade button if player doesn't have enough coins
      upgradeBtn.disabled = coins < upgradeCost;
    }

    // Initialize UI on load
    updateUI();
  </script>

</body>
</html>
